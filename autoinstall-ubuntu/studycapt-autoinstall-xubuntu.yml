#cloud-config
#
# Studycapt Xubuntu VM Autoinstall File
#
# Adapted from /var/log/installer/autoinstall-user-data
# Edited by Moses Chong, 2026-06-14
# License: CC0, https://creativecommons.org/publicdomain/zero/1.0/
#
# This autoconfig helps set up an Xubuntu 24.04 VM for
# analysing the CAPT protocol and associated data formats.
# Further details are in the autoinstall-ubuntu.md file.
#
# See the autoinstall documentation at:
# https://canonical-subiquity.readthedocs-hosted.com/en/latest/reference/autoinstall-reference.html
#
autoinstall:
  apt:
    disable_components: []
    fallback: offline-install
    geoip: true
    mirror-selection:
      primary:
      - country-mirror
      - arches: &id001
        - amd64
        - i386
        uri: http://archive.ubuntu.com/ubuntu/
    preserve_sources_list: false
    security:
    - arches: *id001
      uri: http://security.ubuntu.com/ubuntu/
  codecs:
    install: false
  drivers:
    install: false
  debconf-selections:
    wireshark-common wireshark-common/install-setuid boolean true
  interactive-sections:
    - identity
    - storage
  kernel:
    package: linux-generic
  keyboard:
    layout: us
    toggle: null
    variant: ''
  late-commands:
    - curtin in-target -- dpkg --add-architecture i386
    - curtin in-target -- apt-get update
    - curtin in-target -- apt-get install -y libatk1.0-0t64:i386 libc6:i386 libcairo2:i386 libgtk2.0-0t64:i386 libpango-1.0-0:i386 libpopt0:i386 libstdc++6:i386 libxml2:i386
  locale: en_US.UTF-8
  oem:
    install: false
  packages:
    - automake
    - b3sum
    - evince
    - build-essential
    - gimp
    - git
    - inkscape
    - libcanberra-gtk-module
    - libcups2-dev
    - libreoffice
    - libglade2-0
    - vim-gtk3
    - wireshark
  source:
    id: xubuntu-desktop-minimal
    search_drivers: false
  ssh:
    allow-pw: false
    authorized-keys: []
    install-server: false
  timezone: UTC
  updates: security
  version: 1
